{{ define "main" }}
<section class="wrap listing">
  <header class="listing-head">
    <p class="eyebrow"><a href="{{ "tags/" | relURL }}">Tags</a></p>
    <h1 class="listing-title">{{ .Title }}</h1>
    <p class="article-date">{{ len .Pages }} {{ if eq (len .Pages) 1 }}post{{ else }}posts{{ end }}</p>
  </header>
  {{- partial "post-rows.html" .Pages }}
</section>
{{ end }}
