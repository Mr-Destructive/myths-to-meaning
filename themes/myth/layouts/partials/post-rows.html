{{- /* Renders a sorted list of pages with verse/day ordering. */ -}}
{{- $pages := . -}}
<ul class="post-list">
  {{- range $pages.ByTitle }}
  <li>
    <a href="{{ .RelPermalink }}">
      {{- if .Params.part }}<span class="pl-part">{{ .Params.part }}</span>{{ end }}
      <span class="pl-title">{{ .Title }}</span>
      {{- with .Params.subtitle }}<span class="pl-sub">{{ . }}</span>{{ end }}
      <time class="pl-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan 2006" }}</time>
    </a>
  </li>
  {{- end }}
</ul>
