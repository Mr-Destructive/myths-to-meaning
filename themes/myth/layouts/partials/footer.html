<footer class="site-footer">
  <div class="wrap">
    <div class="foot-ornament" aria-hidden="true">❊</div>
    <p class="foot-note">{{ site.Params.footerNote }}</p>
    {{- with site.Params.social.substack }}
    <p class="foot-links">
      <a href="{{ . }}" rel="noopener" target="_blank">Originally on Substack</a>
      <span aria-hidden="true">·</span>
      <a href="{{ "index.xml" | relURL }}">RSS</a>
    </p>
    {{- end }}
    <p class="foot-copy">© {{ now.Year }} {{ site.Params.author }}</p>
  </div>
</footer>
