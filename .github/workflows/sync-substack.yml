name: Sync from Substack

on:
  schedule:
    # 04:17 UTC daily. Off-peak and deliberately off the hour -- GitHub delays
    # cron jobs that fire on :00 because of load, and we do not care about the
    # exact minute, only that it runs once a day.
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # Only the publish job uses these two; declared at the top because a
  # workflow_call cannot be granted more than the caller's own ceiling.
  pages: write
  id-token: write

concurrency:
  group: sync-substack
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Hard cap: apt + pandoc + a handful of fetches normally finish in ~2 min.
    # Anything beyond this is a hung network call; better to kill it and let
    # tomorrow's cron retry than to burn a runner.
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      added: ${{ steps.sync.outputs.added }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the sync script diffs against committed content, and
          # a shallow clone can leave us with a tree that is not HEAD.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          # curl_cffi: Chrome-TLS-impersonating fetch, used as the second
          # layer when Substack's edge 403s the runner's IP on the first.
          pip install beautifulsoup4 curl_cffi

      - name: Check for new posts
        id: sync
        # shell: bash -> bash -eo pipefail. Without it, `python | tee` reports
        # tee's exit code, a crashing sync looks green, and the run silently
        # publishes nothing (observed in the wild -- this is not theoretical).
        shell: bash
        run: |
          python3 scripts/sync_rss.py | tee sync.log
          # Tell the publish job whether anything landed. Set from the working
          # tree, before the commit step, so it reflects what was just emitted.
          if [ -n "$(git status --porcelain -- content/)" ]; then
            echo "added=true" >> "$GITHUB_OUTPUT"
          fi
          # Surface the result in the run summary for humans.
          if [ -f data/sync-report.json ]; then
            {
              echo "## Substack sync"
              echo '```json'
              cat data/sync-report.json
              echo '```'
              NEEDS=$(python3 -c "import json;print(', '.join(json.load(open('data/sync-report.json'))['needs_editorial']))")
              if [ -n "$NEEDS" ]; then
                echo ""
                echo ":warning: **$NEEDS** -- new section(s) need a \`glyph\` and \`blurb\` in their \`_index.md\`."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit new posts
        run: |
          if [ -z "$(git status --porcelain -- content/)" ]; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # No [skip ci]: the commit stays normal for history. Note that this
          # push (made with the default GITHUB_TOKEN) can never trigger the
          # build workflow itself -- GitHub's recursion guard -- which is what
          # the publish job below is for.
          COUNT=$(git status --porcelain -- content/ | wc -l)
          SECTIONS=$(python3 -c "import json;print(', '.join(json.load(open('data/sync-report.json'))['sections']))" 2>/dev/null || echo "content")
          git add content/
          git commit -m "content: sync $COUNT new post(s) from Substack ($SECTIONS)"
          git push

  publish:
    # The freshly committed post only exists on master AFTER this run started,
    # and the bot's own push cannot trigger the build workflow (GitHub's
    # recursion guard). So when -- and only when -- something was added, call
    # build-deploy directly. It checks out the branch tip, so it sees the new
    # commit. No PAT or extra secret needed.
    needs: sync
    if: needs.sync.outputs.added == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-deploy.yml
